<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Direct Workbench</title>
    <style>
      /* The Workbench's layout drawn in light while it gets ready, at the
         places the real borders will be (t3-direct-surface.css: 280 px
         sidebar, 58 px thread bar, 52 px utility rail, composer at the
         bottom). On finish the veil dissolves over the loaded app and the
         lines settle into its borders. */
      :root {
        --bg: #090a0c;
        --accent: #a7b0ff;
        --beam: #dfe3ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: progress;
        user-select: none;
        font-family: "Segoe UI", "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      .veil {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1200px 520px at 58% 82%, rgba(135, 146, 255, 0.07), transparent 70%),
          var(--bg);
      }
      svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .line {
        fill: none;
        stroke: rgba(167, 176, 255, 0.22);
        stroke-width: 1;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 560ms cubic-bezier(0.22, 0.8, 0.24, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }
      /* A wide faint copy of the beam stands in for a blur: a blur filter
         over the whole window cost the loading page CPU every frame. */
      .halo {
        fill: none;
        stroke: url(#beam);
        stroke-width: 6;
        stroke-opacity: 0.16;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 560ms cubic-bezier(0.22, 0.8, 0.24, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }
      .beam {
        fill: none;
        stroke: url(#beam);
        stroke-width: 1.4;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 560ms cubic-bezier(0.22, 0.8, 0.24, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }
      .ghost {
        fill: rgba(241, 241, 240, 0.045);
        opacity: 0;
        animation: ghost-in 420ms ease-out forwards, breathe 1.6s ease-in-out 600ms infinite;
        animation-delay: var(--delay, 0ms), calc(var(--delay, 0ms) + 600ms);
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes ghost-in {
        to { opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .status {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        letter-spacing: 0.01em;
        color: transparent;
        background: linear-gradient(100deg, #5d6070 0%, #5d6070 38%, #e9ebff 50%, #5d6070 62%, #5d6070 100%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0;
        animation: status-in 360ms ease-out 260ms forwards, shimmer 1.8s linear 260ms infinite;
      }
      @keyframes status-in {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes shimmer {
        from { background-position: 100% 0; }
        to { background-position: -160% 0; }
      }
      /* The finish: lines flare, the veil dissolves over the loaded app,
         then the lines fade into the app's own borders. */
      body.done .veil {
        transition: opacity 280ms ease-out 60ms;
        opacity: 0;
      }
      body.done svg {
        transition: opacity 300ms ease-in 180ms;
        opacity: 0;
      }
      body.done .beam {
        transition: stroke-width 160ms ease-out;
        stroke-width: 2.2;
      }
      body.done .status {
        transition: opacity 140ms ease-out, transform 200ms ease-out;
        opacity: 0 !important;
        transform: translateY(-4px);
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .beam, .halo { animation: none; stroke-dashoffset: 0; }
        .ghost, .status { animation: none; opacity: 1; }
        #beam animateTransform { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="veil"></div>
    <svg id="sketch" aria-hidden="true"></svg>
    <div class="status" id="status">Getting the Workbench ready</div>
    <script>
      (() => {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.getElementById("sketch");
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const SIDEBAR = 280;
        const BAR = 58;
        const RAIL = 52;
        const composer = { x: SIDEBAR + 60, w: Math.max(240, W - RAIL - 60 - (SIDEBAR + 60)), h: 174 };
        composer.y = H - 16 - composer.h;

        const make = (tag, attrs) => {
          const node = document.createElementNS(ns, tag);
          for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
          return node;
        };
        const defs = make("defs", {});
        // A light band sweeping across the drawing, around and around.
        const beam = make("linearGradient", { id: "beam", gradientUnits: "userSpaceOnUse", x1: -520, y1: 0, x2: 0, y2: 260 });
        for (const [offset, color, alpha] of [[0, "#a7b0ff", 0.12], [0.5, "#dfe3ff", 0.95], [1, "#a7b0ff", 0.12]]) {
          beam.append(make("stop", { offset, "stop-color": color, "stop-opacity": alpha }));
        }
        beam.append(make("animateTransform", {
          attributeName: "gradientTransform",
          type: "translate",
          from: "0 0",
          to: `${W + 1040} 0`,
          dur: "1.9s",
          repeatCount: "indefinite",
        }));
        defs.append(beam);
        svg.append(defs);

        const rounded = (x, y, w, h, r) =>
          `M${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + r} Q${x},${y} ${x + r},${y} Z`;
        const shapes = [
          [`M${SIDEBAR + 0.5},0 V${H}`, 0],
          [`M${SIDEBAR},${BAR + 0.5} H${W - RAIL}`, 70],
          [`M${W - RAIL + 0.5},0 V${H}`, 40],
          [rounded(10.5, 10.5, 218, 33, 8), 110],
          [rounded(236.5, 10.5, 32, 33, 8), 150],
          [rounded(10.5, 51.5, 258, 30, 7), 170],
          [`M0,${H - 44.5} H${SIDEBAR}`, 200],
          [rounded(composer.x + 0.5, composer.y + 0.5, composer.w, composer.h, 12), 120],
          [rounded(SIDEBAR + 285, 104.5, Math.max(200, W - RAIL - SIDEBAR - 570), 58, 10), 230],
        ];
        for (const [d, delay] of shapes) {
          for (const kind of ["halo", "line", "beam"]) {
            svg.append(make("path", { d, class: kind, pathLength: 1, style: `--delay:${delay}ms` }));
          }
        }
        // Thread rows in the sidebar, breathing while the list loads.
        const rows = [[114, 150, 18], [147, 200, 14], [178, 186, 14], [209, 194, 14], [247, 170, 18], [280, 196, 14]];
        rows.forEach(([y, w, h], index) => {
          svg.append(make("rect", {
            x: index === 0 || index === 4 ? 16 : 32,
            y: y - h / 2,
            width: w,
            height: h,
            rx: h / 2,
            class: "ghost",
            style: `--delay:${180 + index * 45}ms`,
          }));
        });

        const status = document.getElementById("status");
        status.style.left = `${composer.x + 23}px`;
        status.style.top = `${composer.y + 24}px`;

        window.workbenchSplashFinish = () => {
          document.body.classList.add("done");
          return true;
        };
      })();
    </script>
  </body>
</html>
